
<!DOCTYPE html>

                <div class="header-controls">

    <div class="container">
        <div class="cart-items">
            <div class="filter-section">
                <select class="filter-dropdown" id="filterDropdown">
                    <option value="">⊞ Filtered by</option>
                    <option value="product">Product name</option>
                    <option value="color">Color</option>
                    <option value="size">Size</option>
                    <option value="quantity">Quantity</option>
                    <option value="price">Price</option>
                </select>

                <div class="filter-options" id="filterOptions"></div>
                
            </div>
            
            <!-- Cart Item 1 -->
            <div class="cart-item">
                <input type="checkbox" class="checkbox" checked>
                <img src="/Users/dilyshuynh/Library/Group Containers/group.com.readdle.documents/MusicWidget/Documents/Web BootCamp/Image/soap.png" alt="Bee Wax Soap" class="item-image">
                <div class="item-details">
                    <div class="item-info">
                        <h3>Bee Wax Soap</h3>
                    </div>
                    <div class="item-quantity">Quantity</div>
                        <input type="number" class="quantity-input" value="1" min="1">
                    <div class="item-price">Price<br>$40</div>
                    <button class="delete-btn">🗑</button>
                </div>
            </div>
            
            <!-- Cart Item 2 -->
            <div class="cart-item">
                <input type="checkbox" class="checkbox" checked>
                <img src="/Users/dilyshuynh/Library/Group Containers/group.com.readdle.documents/MusicWidget/Documents/Web BootCamp/Image/set.png" alt="Holiday's gift set" class="item-image">

                    <div class="item-info">
                        <h3>Holiday's gift set</h3>
                    </div>
                    <div class="item-quantity">Quantity</div>
                        <input type="number" class="quantity-input" value="1" min="1">
                    <div class="item-price">Price<br>$2000</div>
                    <button class="delete-btn">🗑</button>
                </div>
            </div>
        </div>
        
        <!-- Receipt -->
        <div class="receipt">
            <div class="receipt-header">Receipt</div>
            <button class="close-btn">✕</button>
            
            <table class="receipt-table">
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Quantity</th>
                        <th>Price</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            <img src="/Users/dilyshuynh/Library/Group Containers/group.com.readdle.documents/MusicWidget/Documents/Web BootCamp/Image/soap.png" alt="Soap" class="receipt-item-image">
                            <p class="receipt-product-name">Bee Wax Soap</p>
                        </td>
                        <td>1</td>
                        <td>$40</td>
                    </tr>
                  
                    <tr>
                        <td>
                            <img src="/Users/dilyshuynh/Library/Group Containers/group.com.readdle.documents/MusicWidget/Documents/Web BootCamp/Image/set.png" alt="Gift Set" class="receipt-item-image">
                            <p class="receipt-product-name">Holiday's Gift Set</p>
                        </td>
                        <td>10</td>
                        <td>$2000</td>
                    </tr>

                    <tr class="receipt-total-row">
                        <td>Total</td>
                        <td>11</td>
                        <td>$2040</td>
                    </tr>
                </tbody>
            </table>
            
            <button class="confirm-btn">Confirm</button>
